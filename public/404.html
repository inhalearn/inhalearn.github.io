<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인하런 - 리다이렉트</title>
    <script>
      // GitHub Pages SPA redirect script
      // This preserves the path and query parameters during redirect
      (function () {
        var pathSegmentsToKeep = 0;

        var location = window.location;
        var redirect =
          location.protocol +
          '//' +
          location.hostname +
          (location.port ? ':' + location.port : '') +
          location.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          location.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
          location.hash;

        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>인하런으로 리다이렉트 중입니다. JavaScript를 활성화해주세요.</p>
    </noscript>
  </body>
</html>
